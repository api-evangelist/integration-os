description: >-
  Published pricing for One (withone.ai), the platform IntegrationOS became by way of Pica. Four
  tiers. The headline is unusual: every tier — including Free — includes unlimited connections, 1M
  API calls and full MCP + CLI access, so the paid ladder sells rate limit, relay volume, log
  retention, org/project count and support, not call volume. Agent seats are priced separately at
  $40/agent on every self-serve tier.
