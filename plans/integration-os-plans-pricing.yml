supersedes: >-
  The 2026-05-04 bulk-sweep scaffold, which invented a Free/Professional/Enterprise ladder with
  placeholder quotas. Every figure below is read from the provider's published pricing page for One,
  the successor brand.
tags:
  - Agent Infrastructure
