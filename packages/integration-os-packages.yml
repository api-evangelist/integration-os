description: >-
  First-party client libraries for the One API — the platform IntegrationOS became by way of Pica.
  Versions and publish dates were read from each registry's unauthenticated metadata endpoint on
  2026-09-13. The @picahq/* entries are the previous brand's packages: still published, still
  installable, and no longer receiving releases since the March 2026 rename to One, which is why they
  are listed with official: true and a note rather than dropped.
ownership_note: >-
  These packages are published under the @withone and @picahq npm scopes and the picahq PyPI
  namespace, not under an integrationos namespace. The provider's own changelog states the lineage —
  "2026-03-25 (v3.0.0): Introducing One -- Pica is now One" (https://www.withone.ai/llms.txt) — and
  picaos.com 301-redirects to withone.ai, so the current-brand packages are the successor's.
