  /v1/ai-agents/organizations/{org_id}/projects/{project_id}/{id}:
    delete:
      description: Permanently removes a project-scoped AI agent and shuts down its running runner.
      operationId: delete_project_ai_agent
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Project ID
        in: path
        name: project_id
        required: true
        schema:
          format: uuid
          type: string
      - description: AI agent ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          description: Deleted project AI agent
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Quota exceeded — upgrade plan
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - X-One-Secret: []
      summary: Delete project AI agent
      tags:
      - AI Agents
    get:
      description: Returns the full configuration of a project-scoped AI agent.
      operationId: get_project_ai_agent
      parameters:
      - description: Organization ID
        in: path
