openapi: 3.2.0
info:
  description: The One API. Universal API integration platform for AI agents and applications.
  license:
    name: ''
  title: One AI Agents API
  version: 5.35.0
tags:
- description: Manage AI agents for automation and orchestration
  name: AI Agents
paths:
  /v1/ai-agents:
    get:
      description: Returns the AI agents in your account. Test and live environments are isolated — you'll only see agents that match the environment of your API key.
      operationId: list_ai_agents
      parameters:
      - description: 'Items per page. Default 20, hard-capped at 150. `limit=0` is

          treated as 1. Larger values silently clamp.'
        example: 20
        in: query
        name: limit
        required: false
        schema:
          default: 20
          format: int64
          maximum: 150
          minimum: 0
          type: integer
      - description: Page number for pagination (1-indexed). Defaults to 1.
        example: 1
        in: query
        name: page
        required: false
        schema:
          default: 1
          format: int64
          minimum: 0
          type: integer
      - description: 'Number of items to skip before the first returned item. Defaults to 0.

          Most callers should leave this at 0 and rely on `page` + `limit`.'
        example: 0
        in: query
        name: skip
        required: false
        schema:
          default: 0
          format: int64
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  page:
                    format: int64
                    minimum: 0
                    type: integer
                  pages:
                    format: int64
                    minimum: 0
                    type: integer
                  rows:
                    items:
                      properties:
                        active:
                          type: boolean
                        channels: {}
                        createdAt:
                          format: date-time
                          type: string
                        description:
                          type:
                          - string
                          - 'null'
                        environment:
                          $ref: '#/components/schemas/SecretKeyEnvironment'
                        guardrails: {}
                        id:
                          format: uuid
                          type: string
                        memory: {}
                        model:
                          $ref: '#/components/schemas/AiAgentModelType'
                        modelId:
                          type:
                          - string
                          - 'null'
                        modelProvider:
                          $ref: '#/components/schemas/AiModelProviderType'
                        name:
                          type: string
                        organizationId:
                          format: uuid
                          type:
                          - string
                          - 'null'
                        projectId:
                          format: uuid
                          type:
                          - string
                          - 'null'
                        runnerStatus:
                          oneOf:
                          - type: 'null'
                          - $ref: '#/components/schemas/PodStatusType'
                            description: 'The state of this agent''s runner, when it has one.


                              The agent''s own lifecycle and its pod''s are separate, and this field is

                              what lets a caller see the second without conflating it into the first.

                              An agent that has never been run has no pod and reports `None`; one

                              whose pod was stopped - by the owner, or by a lapsed seat culling it -

                              reports [`PodStatusType::Terminated`], which is what a console renders

                              as paused.


                              Populated only by the read paths that opt in through

                              [`ViewWithCtxExt::into_view_with_ctx`], so the write paths pay nothing

                              for it.

                              Absent from the wire rather than null when there is no runner, so a

                              response for an agent that has never run is byte-identical to before.'
                        runnerStopReason:
                          oneOf:
                          - type: 'null'
                          - $ref: '#/components/schemas/PodStopReasonType'
                            description: 'What stopped the runner, when it is stopped.


                              `runnerStatus` alone cannot say: a pause the owner performed and a stop

                              billing performed both read `terminated`, which is the whole reason this

                              exists. Absent while the runner is live, and on pods stopped before it

                              was recorded.


                              **A cause, not a prediction.** It records the stop that happened and

                              nothing re-derives it afterwards, so entitlement can move underneath it

                              in both directions: an owner-paused agent stays `user_requested` when

                              its seat later lapses, because the cull only counts what is running,

                              yet `ensure` counts every undeleted agent and will refuse it; and a

                              culled agent stays `seat_lapsed` after a replacement seat is bought,

                              until a resume clears it. Use it to explain what happened - and ask

                              `ensure` whether the agent can start, rather than guessing from

                              this.'
                        runtime:
                          $ref: '#/components/schemas/AiRuntimeType'
                        status:
                          $ref: '#/components/schemas/AiAgentStatusType'
                        tags:
                          items:
                            type: string
                          type: array
                        tools: {}
                        trialSeat:
                          description: 'Whether this agent occupies the owner''s free-trial seat.


                            Worth surfacing because it decides what happens when the trial ends:

                            this is the agent stopped first, ahead of the least recently used. It

                            is also the only way a caller learns whether a `useTrial` create took

                            effect, since that flag is ignored rather than rejected when there is

                            no live trial or another agent already holds the seat.


                            Absent from the wire rather than `false` on the paths that do not

                            resolve it, so "not on the trial seat" is never confused with "not

                            asked".'
                          type:
                          - boolean
                          - 'null'
                        triggers:
                          oneOf:
                          - type: 'null'
                          - $ref: '#/components/schemas/AiAgentTriggers'
                        updatedAt:
                          format: date-time
                          type: string
                        userId:
                          format: uuid
                          type: string
                        version:
                          type: string
                        volumeId:
                          format: uuid
                          type:
                          - string
                          - 'null'
                      required:
                      - id
                      - userId
                      - name
                      - model
                      - status
                      - tools
                      - environment
                      - runtime
                      - modelProvider
                      - createdAt
                      - updatedAt
                      - version
                      - tags
                      - active
                      type: object
                    type: array
                  total:
                    format: int64
                    minimum: 0
                    type: integer
                required:
                - rows
                - total
                - pages
                - page
                type: object
          description: List of AI agents
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Quota exceeded — upgrade plan
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - X-One-Secret: []
      summary: List AI agents
      tags:
      - AI Agents
    post:
      description: Creates a new AI agent. Choose the model, the skills it can call, any guardrails, channels it should respond on, triggers that wake it up, and an optional memory store. Subject to your plan's AI-agent quota.
      operationId: create_ai_agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiAgentParams'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAgentView'
          description: Created AI agent
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Quota exceeded — upgrade plan
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - X-One-Secret: []
      summary: Create AI agent
      tags:
      - AI Agents
