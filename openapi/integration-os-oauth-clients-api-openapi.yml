components:
  schemas:
    GrantedConnectorView:
      description: 'One connector an issued grant reaches, as an audit surface reports it.


        **Not [`ResolvedConnectorView`].** This is a read-only report, never fed

        back into a request: a dashboard folds every live token together, and the

        envelopes of several grants on one connector do not combine into one, so a

        rule-shaped answer here would be a rule nobody granted.'
      properties:
        actionCount:
          description: 'Distinct actions reached across every grant and connection touching

            this connector - the union, so a shared action counts once and disjoint

            ones each.'
          minimum: 0
          type: integer
        connectionCount:
          description: 'Distinct connections the grants name here. `None` when one of them

            named the *connector*, which reaches every connection on it including

            ones added later, so no count would be true for long.'
          minimum: 0
          type:
          - integer
          - 'null'
        connectionDefinitionId:
          $ref: '#/components/schemas/ConnectionDefinitionId'
        imageUrl:
          type: string
        name:
          type: string
        platform:
          type: string
      required:
      - connectionDefinitionId
      - name
      - platform
      - imageUrl
      - actionCount
      type: object
    ResolvedConnectorView:
      allOf:
      - $ref: '#/components/schemas/EnvelopeView'
      - properties:
          actionCount:
            minimum: 0
            type: integer
          connectionDefinitionId:
            $ref: '#/components/schemas/ConnectionDefinitionId'
          imageUrl:
            type: string
          name:
            type: string
          platform:
            type: string
        required:
        - connectionDefinitionId
        - name
        - platform
        - imageUrl
        - actionCount
        type: object
    Paginated_OAuthPermissionSetView:
      properties:
        page:
          format: int64
          minimum: 0
          type: integer
        pages:
          format: int64
          minimum: 0
          type: integer
        rows:
          items:
            description: 'The wire shape of a permission set.


              Lives here rather than beside the entity in `common`: it is the response

              contract of core''s `/v1/oauth-clients` routes and would make no sense

              without them, and a shared crate holds no one consumer''s vocabulary. The

              entity and its store stay in `common`, where any service could reuse them.'
            properties:
              active:
                type: boolean
              clientId:
                description: 'The owning client''s public `client_id`, not the integer key: the key is

                  internal and the caller addresses the client by the string everywhere

                  else in `/v1/oauth-clients`.'
                type: string
              connectorRules:
                description: 'The connectors this set grants, or `null` for the **allow-all** set,

                  which grants every connector exactly as a ceremony naming no set does.

                  The same shape create accepts, so a fetched set round-trips.'
                items:
                  $ref: '#/components/schemas/ConnectorRule'
                type:
                - array
                - 'null'
              createdAt:
                format: date-time
                type: string
              id:
                format: uuid
                type: string
              name:
                type: string
              updatedAt:
                format: date-time
                type: string
            required:
            - id
            - clientId
            - name
            - createdAt
            - updatedAt
            - active
            type: object
          type: array
        total:
          format: int64
          minimum: 0
          type: integer
      required:
      - rows
      - total
      - pages
      - page
      type: object
    CreateParams:
      properties:
        accessTokenTtl:
          description: Access-token lifetime in seconds. One of the offered choices, or null for the platform default; any other value is refused.
          enum:
          - 604800
          - 2592000
          - 7776000
          - 31536000
          - null
          format: int32
          type:
          - integer
          - 'null'
        clientType:
          type: string
        consentSurface:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ConsentSurface'
            description: 'Where this client''s users grant consent. Omit for `hosted`, the page

              core renders itself.'
        description:
          type:
          - string
          - 'null'
        homepageUrl:
          type:
          - string
          - 'null'
        logoUrl:
          type:
          - string
          - 'null'
        name:
          $ref: '#/components/schemas/NonEmptyString'
        redirectUris:
          items:
            type: string
          type: array
      required:
      - name
      - clientType
      - redirectUris
      type: object
    PermissionSetBody:
      properties:
        connectorRules:
          description: 'The connectors this set grants. `null` (or omitted) creates the

            **allow-all** set, which grants every connector - the named,

            referenceable equivalent of authorizing with no set at all.'
          items:
            $ref: '#/components/schemas/ConnectorRule'
          type:
          - array
          - 'null'
        name:
          $ref: '#/components/schemas/NonEmptyString'
      required:
      - name
      type: object
    ConnectionDefinitionId:
      description: Prefixed ID with 'conn_def' prefix (e.g., 'conn_def_1C'), also accepts raw integer
      type: string
    UpdateParams:
      properties:
        accessTokenTtl:
