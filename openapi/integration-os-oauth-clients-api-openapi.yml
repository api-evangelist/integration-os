      - type
      - status
      type: object
    Method:
      enum:
      - OPTIONS
      - GET
      - POST
      - PUT
      - DELETE
      - HEAD
      - TRACE
      - CONNECT
      - PATCH
      type: string
    AllowedActionView:
      properties:
        id:
          description: 'The action''s **`system_id`**, not its row id.


            This is the identifier a rule''s `actionIds` carries and the one both

            the permission-set editor and the consent submission are validated

            against, so it is the only id a client can send back. Publishing the

            row id instead round-trips into an action that resolves to a different

            connector, which consent now refuses as foreign.'
          type: string
        title:
          type: string
      required:
      - id
      - title
      type: object
    EnvelopeView:
      description: 'What a connector rule lets through, as every surface publishes it.


        **Absent means unrestricted, on the way out and on the way back in.** A

        submission that omits `methods` asks for *every* method, so a client offered

        a narrowed connector sends this envelope back verbatim or its submission is

        refused as widening - and "copy what is there, omit what is not" therefore

        produces a valid submission in every case. Published without it, a narrowed

        offer was impossible to accept at all.


        One type rather than one per surface: the held rule and the ask it is

        bounded by are the same envelope answering the same round-trip contract, and

        two definitions of it would eventually disagree.'
      properties:
        allowedActions:
          description: 'Resolved titles for the rule''s `action_ids`, present only when the rule

            narrows to a specific set (i.e. a custom rule). `None` means every

            action on the connector, which a customer-facing UI labels

            generically rather than listing.'
          items:
            $ref: '#/components/schemas/AllowedActionView'
          type:
          - array
          - 'null'
        methods:
          items:
            $ref: '#/components/schemas/Method'
          type:
          - array
          - 'null'
      type: object
