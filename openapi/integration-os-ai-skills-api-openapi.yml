  /v1/ai-skills/{id}/versions:
    get:
      description: Returns the full version history of an AI skill. Use it to see what changed across releases or to find a specific version to pin an agent to.
      operationId: list_ai_skill_versions
      parameters:
      - description: AI skill ID
        in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/AiSkillId'
      - in: query
        name: verificationStatus
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/VerificationStatus'
      - in: query
        name: page
        required: true
        schema:
          $ref: '#/components/schemas/Page'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginated_AiSkillVersionView'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Quota exceeded — upgrade plan
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource state does not allow this action
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - X-One-Secret: []
      - OAuth2:
        - user:ai_skills:read
      summary: List AI skill versions
      tags:
      - AI Skills
  /v1/ai-skills/{id}/versions/{version}/yank:
    post:
      description: Marks a published version as yanked so it can no longer be selected as the live version. Useful for emergency rollback after a bad release. The reason you provide is recorded for audit.
      operationId: yank_ai_skill_version
      parameters:
      - description: AI skill ID
        in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/AiSkillId'
      - description: Version number
        in: path
        name: version
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YankBody'
        required: true
      responses:
        '200':
          content:
            application/json:
