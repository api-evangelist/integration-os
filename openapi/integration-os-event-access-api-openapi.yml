openapi: 3.2.0
info:
  description: The One API. Universal API integration platform for AI agents and applications.
  license:
    name: ''
  title: One Event Access API
  version: 5.35.0
tags:
- name: Event Access
paths:
  /v1/event-access:
    get:
      operationId: list_event_access
      parameters:
      - in: query
        name: page
        required: true
        schema:
          $ref: '#/components/schemas/Page'
      - description: 'Optional, and **ignored for a bearer** - `pinned_environment`

          substitutes the token''s own.


          Defaulted, unlike its counterpart on the create bodies, because the two

          are different questions: here the value narrows a listing, and the

          default narrows it to `test`, which is visible in the rows that come

          back. There it decides which environment a new key is minted for, where

          a silently defaulted value is a wrong key rather than a wrong page.'
        in: query
        name: environment
        required: false
        schema:
          $ref: '#/components/schemas/SecretKeyEnvironment'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginated_EventAccessView'
          description: Paginated list of event access keys
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource already exists
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - Session: []
      - OAuth2:
        - user:secrets:read
      tags:
      - Event Access
      summary: List event access
      x-summary-source: derived
    post:
      operationId: create_event_access
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Params'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAccessView'
          description: Created event access key
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource already exists
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - Session: []
      - OAuth2:
        - user:secrets:write
      tags:
      - Event Access
      summary: Create event access
      x-summary-source: derived
