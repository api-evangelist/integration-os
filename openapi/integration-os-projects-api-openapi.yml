    CreateProjectKeyParams:
      additionalProperties: false
      description: 'Body for `POST

        /v1/management/organizations/{org_id}/projects/{project_id}/keys`.


        Mints an additional regular project-scoped API key. The

        `connectionType` is always `api` for keys minted via the Management

        API surface and is set internally. The environment is inherited

        from the calling credential rather than being requested in the

        body.'
      properties:
        name:
          description: 'Optional label for the new key (shown in the dashboard''s API

            keys list). When omitted, the key is unnamed.'
          type:
          - string
          - 'null'
      type: object
    ConfigureAccessParams:
      additionalProperties: false
      description: 'Body for the configure-key endpoints. Replaces (not merges) the access

        rules on an API key; at least one of `methods` or `rules` must be present.


        **Scope: passthrough only.** `methods` and `rules` are evaluated only when

        the key calls the passthrough API (the proxy to the external platform).

        They do NOT gate first-party endpoints (`/v1/connections/*` CRUD, webhooks,

        vault, …), which stay authorized by the key''s role and tenancy.'
      properties:
        methods:
          description: 'Global allow-list for passthrough calls only. Matched against the

            **semantic CRUD method** (`Get`/`Post`/…) on the targeted action

            definition, NOT the incoming request''s HTTP method. Per-connection

            `rules` can override it. `null`/omitted leaves it unset (every semantic

            method allowed globally).'
          items:
            $ref: '#/components/schemas/Method'
          type:
          - array
          - 'null'
        rules:
          description: 'Per-connection rules for passthrough calls only. When present, the

            passthrough API can only reach the connections these rules reference.

            Each rule targets a connection by `connectionKey` and may override the

            global `methods` or narrow via `actionIds`. See the `AccessRule` schema.'
          items:
            $ref: '#/components/schemas/AccessRule'
          type:
          - array
          - 'null'
      type: object
    EventAccessId:
      description: Prefixed ID with 'evt_ac' prefix (e.g., 'evt_ac_1C'), also accepts raw integer
      type: string
    UpdateMemberRoleParams:
