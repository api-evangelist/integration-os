auth:
  style: api-key header, plus bearer and OAuth 2.0 authorization code
  primary_header: x-one-secret
  bearer: 'Authorization: Bearer <token>'
  oauth2:
    flow: authorizationCode
    authorization_url: https://api.withone.ai/oauth/authorize
    token_url: https://api.withone.ai/oauth/token
    pkce: S256
    dynamic_client_registration: https://mcp.withone.ai/oauth/register
  environments:
    - sandbox
    - production
  environment_note: >-
    Keys are environment-bound and connectors cannot move between environments once created. Both
    environments include unlimited connections and unlimited API calls.
  see: authentication/integration-os-authentication.yml
tenancy_headers:
  headers:
    - name: X-One-Organization-Id
      used_by_operations: 39
      purpose: Selects the organization scope for an operation that supports org-level addressing.
    - name: X-One-Project-Id
      used_by_operations: 39
      purpose: Selects the project scope.
    - name: X-One-Connection-Key
      used_by_operations: 5
      purpose: Names the connection a passthrough call executes against.
    - name: X-One-Action-Id
      used_by_operations: 5
      purpose: Names the knowledge action a passthrough call executes.
  note: >-
    Scope is also expressible in the PATH — most resources ship three sibling operations
    (`/v1/x`, `/v1/x/organizations/{org_id}`, `/v1/x/organizations/{org_id}/projects/{project_id}`).
    That path triplication is why 248 operations describe roughly 90 distinct capabilities.
pagination:
  style: offset
  params:
    - name: page
      used_by_operations: 53
    - name: limit
      used_by_operations: 40
    - name: skip
      used_by_operations: 39
  cursor: false
  response_fields: null
  note: >-
