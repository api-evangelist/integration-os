idempotency:
  coverage: partial
  mechanism: idempotent upsert on a caller-supplied key in the path — no Idempotency-Key header exists
  header: null
  scope:
    - upsert_webhook_subscription
    - upsert_organization_authkit
    - upsert_project_authkit
    - ensure_ai_runner
    - ensure_org_ai_runner
    - ensure_project_ai_runner
  retention: null
  evidence: >-
    The One API declares exactly one idempotency contract in prose, on
    UpsertSubscriptionParams — "Body of the idempotent upsert" (PUT
    /v1/webhooks/subscriptions/by-key/{key}). The remaining entries above are PUT-upsert and
    ensure-shaped operations that are idempotent by HTTP semantics. 134 other mutating operations
    (64 POST, 39 DELETE, 14 PATCH and the other PUTs) carry no replay protection and no
    Idempotency-Key header appears anywhere in the spec or the docs.
  source: openapi/integration-os-one-api-openapi.json
reversibility:
  grade: documented
  note: >-
    Reversal operations exist across the write surface and are easy to name; NO window is stated
    anywhere in the docs for any of them, so this grades `documented` and not `verified`. Nothing
    below asserts a time limit, because the provider states none.
  surfaces:
    - write: create_oauth_client / specify_connection_access / update_connection_access
      reversal: revoke_connection_access
      operationId: revoke_connection_access
      window: null
      note: DELETE /v1/access/{id} removes all restrictions from a key; the inverse of specify/update.
    - write: oauth grant (consent screen)
      reversal: revoke_oauth_authorization
      operationId: revoke_oauth_authorization
      window: null
      note: DELETE /v1/oauth-authorizations/{client_id}. Also revoke_oauth_client_user per user.
    - write: send_link_invitation
      reversal: revoke_link_invitation
      operationId: revoke_link_invitation
      window: null
      note: Invitations can also be resent (resend_link_invitation) rather than reissued.
    - write: create_organization_invitation / create_project_invitation
      reversal: revoke_organization_invitation
      operationId: revoke_organization_invitation
      window: null
    - write: publish_ai_skill
      reversal: yank_ai_skill_version
      operationId: yank_ai_skill_version
      window: null
      note: >-
        A published skill version is yanked, not deleted — POST
        /v1/ai-skills/{id}/versions/{version}/yank. Versions remain listable via
        list_ai_skill_versions. No yank window is documented.
    - write: rotate_link / regenerate_oauth_client_secret / regenerate_ai_runner_dashboard_password
      reversal: none
      operationId: null
      window: null
      note: >-
        Credential rotation is IRREVERSIBLE — the prior secret is gone. The docs additionally
        describe API keys as one-time-copyable (changelog v2.7.0), so a rotated key cannot be
        recovered from the dashboard either.
    - write: passthrough (execute an action on a third-party platform)
      reversal: none
      operationId: null
      window: null
      note: >-
        THE MOST IMPORTANT ROW. The Passthrough surface proxies an arbitrary write into a third-party
        API (Stripe, Gmail, HubSpot, Shopify). Whether that action can be taken back is governed by
        the downstream platform, not by One, and One documents no compensating action. An agent
        calling execute_one_action cannot learn from One whether the call is reversible.
    - write: delete_connection / delete_ai_agent / delete_project / delete_organization
      reversal: none
      operationId: null
      window: null
      note: No restore/undelete operation exists for any resource; no soft-delete retention is documented.
dry_run_mode:
  supported: partial
  note: >-
    There is no request-level dry-run flag. Two adjacent affordances exist: a dedicated Sandbox
    environment with isolated credentials, and test_org_webhook_subscription /
    test_project_webhook_subscription, which fire a test delivery at a subscription without waiting
    for a real event. Neither rehearses a passthrough call.
  source: https://www.withone.ai/docs/api-reference/authentication
