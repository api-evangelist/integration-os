problem_types:
  - status: 400
    operations: 178
    title: Bad Request
    remediation: Validate the request body against the operation's schema before retrying.
  - status: 401
    operations: 39
    title: Unauthorized
    remediation: >-
      Supply x-one-secret, a bearer token, or an OAuth access token for the right environment. Keys
      are environment-bound; a sandbox key on a production resource fails here.
  - status: 402
    operations: 186
    title: Payment Required
    remediation: >-
      Plan quota or seat entitlement exhausted. 402 is declared on 75% of the surface, which makes
      billing state a first-class failure mode on this API rather than an edge case — an agent MUST
      handle it. See plans/integration-os-plans-pricing.yml.
  - status: 403
    operations: 206
    title: Forbidden
    remediation: >-
      The key or grant lacks the required permission or scope for this org/project. Check
      scopes/integration-os-scopes.yml and any connection-access restriction on the key.
  - status: 404
    operations: 214
    title: Not Found
    remediation: Confirm the id and the org/project scope; scoped siblings 404 across tenants by design.
  - status: 409
    operations: 24
    title: Conflict
    remediation: >-
      Resource already exists or is in a conflicting state. Reach for the upsert/ensure variant where
      one exists rather than retrying the create.
  - status: 422
    operations: 34
    title: Unprocessable Entity
    remediation: Semantically invalid input that parsed but cannot be applied.
  - status: 429
    operations: 39
    title: Too Many Requests
    remediation: >-
      Per-plan rate limit exceeded (100/min Free, 500/min Starter, 1,000/min Pro). Back off; no
      Retry-After or RateLimit-* header is documented, so use exponential backoff with jitter.
  - status: 500
    operations: 190
    title: Internal Server Error
    remediation: Retry with backoff; quote correlationId to support.
  - status: 502
    operations: 49
    title: Bad Gateway
    remediation: >-
      Typically an upstream third-party platform failing behind a passthrough call, not One itself.
  - status: 503
    operations: 42
    title: Service Unavailable
    remediation: Check https://status.withone.ai/ and retry with backoff.
gaps:
  - >-
    No error CODE registry is published — the envelope carries a `key` field but the docs enumerate
    no values for it, so an agent cannot branch on anything but the HTTP status.
  - >-
    No 4xx coverage is uniform: 401 is declared on only 39 of 248 operations while 403 is declared on
    206, so the spec's response sets are not a reliable guide to what an unauthenticated call returns.
