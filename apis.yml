aid: integration-os
name: IntegrationOS
segments:
  - Integrations
description: >-
  IntegrationOS was a unified API platform that let developers add third-party
  integrations to their products with a single API call. The company rebranded
  as Pica (picaos.com) and then, on 2026-03-25, as One (withone.ai) — the
  provider's own changelog records the step as "Pica is now One". One is an
  agent infrastructure platform: authenticated access to 789 platforms and
  111,176 actions through a unified CLI, managed OAuth (AuthKit), multi-step
  Flows, inbound webhook Relay, and both a hosted and a local Model Context
  Protocol server. This record preserves the IntegrationOS history and profiles
  the active successor's published surface, including its OpenAPI 3.1.0 contract
  (248 operations), its four-tool MCP server, its llms.txt and its agent.json.
